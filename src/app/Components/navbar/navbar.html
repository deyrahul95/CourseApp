<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container">
    <a class="navbar-brand" routerLink="/">Learner <span>🧑‍💻</span></a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" aria-current="page" routerLink="/">Courses</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" aria-current="page" routerLink="/appointment">Appointments</a>
        </li>

        @if (isAuthenticated) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin">Admin</a>
          </li>
        }
      </ul>
      <button
        type="button"
        class="btn border-0 bg-transparent p-2"
        (click)="toggleTheme()"
        [attr.aria-label]="'Switch to ' + (isDark ? 'light' : 'dark') + ' mode'"
      >
        @if (isDark) {
          <span>
            <i class="bi bi-sun-fill" aria-hidden="true"></i>
          </span>

          <span>
